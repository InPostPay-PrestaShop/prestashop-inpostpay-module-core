    autowire: true
    tags:
      - { name: controller.service_arguments }
      - { name: container.service_subscriber }
    arguments:
      - '@izi\prestashop\Translation\LegacyTranslator'
      - '@inpost.izi.context'
      - !tagged inpost.izi.config_initializer

  izi\prestashop\Form\Type\GeneralConfigurationType:
