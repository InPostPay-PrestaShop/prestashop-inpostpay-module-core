  izi\prestashop\Configuration\GuiConfigurationInterface: '@izi\prestashop\Configuration\GuiConfiguration'
  izi\prestashop\Configuration\GuiConfiguration:
    class: izi\prestashop\Configuration\GuiConfiguration
    autowire: true
    public: false
    tags:
