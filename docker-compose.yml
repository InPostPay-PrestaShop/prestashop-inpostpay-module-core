version: "3.7"

services:
  php:
    image: gitlab.waynet.pl:5050/waynetecommerce/internal/php72-cli
    volumes:
      - ./:/var/www/html/modules/inpostizi
    working_dir: /var/www/html/modules/inpostizi
    environment:
      _PS_ROOT_DIR_: /var/www/html
  node:
    image: node:14.21
    volumes:
      - ./:/var/www/html/modules/inpostizi
    working_dir: /var/www/html/modules/inpostizi
    environment:
      PATH: /var/www/html/_dev/node_modules/.bin/:$PATH
